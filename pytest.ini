[pytest]
# PolyPaper Bot — pytest configuration (Epic 9 T9.9).
#
# Markers (used with @pytest.mark.<name> or auto-applied via conftest):
#   integration  — tests under tests/integration/ — smoke-level engine
#                  construction + pure-logic + deterministic state sims.
#                  Auto-applied by tests/integration/conftest.py.
#   slow         — tests that take >1s individually. Currently unused but
#                  reserved for long-running scenarios (e.g., 1000-event
#                  replay if it ever grows).
#   network      — tests that make real HTTP/WS calls to external services.
#                  None currently; reserve for T9.8-REG Windows backlog.
#   windows_only — tests that require Windows-specific deps (py-clob-client,
#                  optuna, full aiosqlite WAL). Skipped in sandbox. Reserve
#                  for T9.8-REG and any future live-side smoke tests.
#
# Running subsets:
#   py -3.11 -m pytest                              # full suite (sandbox-safe)
#   py -3.11 -m pytest -m "not integration"         # unit-only
#   py -3.11 -m pytest -m integration               # integration-only
#   py -3.11 -m pytest -m "not windows_only"        # sandbox-compatible
#   py -3.11 -m pytest -m "windows_only"            # Windows full-depot run

testpaths = tests

markers =
    integration: construction-level + pure-logic + state-sim integration smoke (Epic 9 T9.8)
    slow: tests that take >1s individually
    network: tests that make real external HTTP/WS calls
    windows_only: tests requiring Windows-only deps (py-clob-client, optuna, full WAL)

# Show summary info for anything other than passing tests.
# -r = (f)ailed (E)rror (s)kipped (x)xfailed (X)xpassed (p)assed (P)assed with output
addopts =
    -ra
    --strict-markers
    --tb=short

# Quieter default output — use `-v` to override
filterwarnings =
    ignore::DeprecationWarning:pkg_resources.*
    ignore::DeprecationWarning:google.*
