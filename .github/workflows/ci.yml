name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Syntax check (py_compile)
        run: |
          python -m py_compile $(git ls-files '*.py' | grep -v '^_archive/')

      # P1-07-d (2026-05-09): ruff is now HARD FAIL.
      # Config lives in pyproject.toml [tool.ruff].
      - name: Ruff lint (hard fail)
        run: |
          ruff check .

      # P1-07-d (2026-05-09): mypy soft-fail until baseline established.
      # Tightening per-module via [tool.mypy.overrides] in pyproject.toml.
      # Flip to hard-fail after P1-07 follow-up clears the long tail.
      - name: mypy core/ (soft fail until baseline clean)
        continue-on-error: true
        run: |
          mypy core/

      - name: T11.8 bare except guard (core/ strict zone)
        run: |
          python scripts/bare_except_check.py --all

      - name: T11.7 env_reference drift check
        run: |
          python scripts/gen_env_reference.py --check

      - name: T11.6-B user-facing exception leak guard
        run: |
          python scripts/check_exc_leak.py --all

      # P1-07-d / P1-01 (2026-05-09): coverage source expanded to
      # core + data + telegram_bot + backtest (via .coveragerc).
      # fail_under = 43 (ratcheted from 21 baseline; configured in .coveragerc).
      # Scope: all tests/, integration filtered out (Windows-only deps).
      - name: Run tests with coverage gate
        env:
          TELEGRAM_BOT_TOKEN: test-token
          ADMIN_TELEGRAM_ID: "1"
          DATABASE_PATH: ":memory:"
        run: |
          python -m pytest tests/ -m "not integration" -v --tb=short \
            --cov --cov-config=.coveragerc \
            --cov-report=term \
            --cov-report=xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

      - name: Upload dead-code audit if present
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dead-code-audit
          path: DEAD_CODE_AUDIT.md
          if-no-files-found: ignore
