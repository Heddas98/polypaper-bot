name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Syntax check (py_compile)
        run: |
          python -m py_compile $(git ls-files '*.py' | grep -v '^_archive/')

      - name: Ruff lint (non-blocking for now)
        continue-on-error: true
        run: |
          ruff check . --exclude _archive,tests/fixtures --statistics

      - name: Run unit tests
        env:
          TELEGRAM_BOT_TOKEN: test-token
          ADMIN_TELEGRAM_ID: "1"
          DATABASE_PATH: ":memory:"
        run: |
          python -m pytest tests/unit -v --tb=short

      - name: Upload dead-code audit if present
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dead-code-audit
          path: DEAD_CODE_AUDIT.md
          if-no-files-found: ignore
